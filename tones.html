<style>
  .site-page{ background: var(--paper); }
  .page-head{ padding: 28px 0 4px; }
  .page-head h1{ font-size: clamp(28px,6vw,40px); }
  .page-head .sub{ margin:8px 0 0; color:var(--muted); font-size:14px; line-height:1.8; }

  .quiz-card{
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:18px; padding:30px 22px; text-align:center;
    box-shadow:0 4px 14px rgba(28,20,16,.08);
  }
  .quiz-card .bigchar{
    font-family:var(--font-display); font-size:clamp(64px,18vw,120px);
    font-weight:900; line-height:1.1; color:var(--ink);
  }
  .quiz-card .hint{ color:var(--muted); font-size:14px; margin:6px 0 14px; }

  .tone-btns{ display:grid; grid-template-columns:repeat(6,1fr); gap:10px; max-width:560px; margin:0 auto; }
  .tone-btns button{
    padding:16px 0; border-radius:14px; border:1px solid var(--line);
    background:var(--paper-warm); color:var(--ink); font-family:var(--font-display);
    font-size:20px; font-weight:900; cursor:pointer; transition:transform .1s ease, background .15s ease;
  }
  .tone-btns button:hover{ transform:translateY(-2px); }
  .tone-btns button.right{ background:var(--tea-green); color:#fff; border-color:transparent; }
  .tone-btns button.wrongpick{ background:var(--danger); color:#fff; border-color:transparent; }

  .feedback{ min-height:26px; margin-top:16px; font-size:15px; font-weight:800; }
  .feedback.ok{ color:var(--tea-green); }
  .feedback.no{ color:var(--danger); }

  .scorebar{
    display:flex; justify-content:center; gap:26px; margin-top:18px;
    font-size:14px; font-weight:800; color:var(--ink-soft);
  }
  .scorebar b{ font-size:20px; color:var(--neon-red); }

  .next-btn{ display:block; margin:20px auto 0; }

  .summary{ text-align:center; padding:8px 0; }
  .summary .big{ font-size:44px; font-weight:900; color:var(--neon-red); }

  @media (max-width:600px){
    .tone-btns{ grid-template-columns:repeat(3,1fr); }
  }
</style>
</head>
<body class="site-page">

<nav class="site-nav" aria-label="站点导航">

<main class="page">
  <header class="page-head">
    <h1 class="neon-title" data-sc="声调练习">聲調練習</h1>
    <p class="sub" data-sc="看字辨调：显示一个汉字，你来选它是第几声。练熟「诗史试时市事」六声就入门了。">看字辨調：顯示一個漢字，你嚟揀佢係第幾聲。練熟「詩史試時市事」六聲就入門。</p>
  </header>

  <div class="quiz-card" id="quiz">
    <div class="bigchar" id="bigChar">詩</div>
    <div class="hint" id="hint" data-sc="这个字是第几声？">呢個字係第幾聲？</div>
    <div class="tone-btns" id="toneBtns"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="scorebar">
    <span><b id="scoreRight">0</b> <span data-sc="对">對</span></span>
    <span><b id="scoreDone">0</b> / <span id="scoreTotal">0</span></span>
  </div>

  <button class="btn btn--neon next-btn" id="nextBtn" type="button" data-sc="下一题" style="display:none;">下一題</button>

  <footer class="site-footer">
    <p data-sc="粤掂 · 为粤语学习者而做">粵掂 · 為粵語學習者而做</p>
    <a href="index.html" data-sc="⌂ 返回首页">⌂ 返回首頁</a>
  </footer>
</main>

<script>
(function(){
  var ITEMS = [
    ['詩','si1',1],['史','si2',2],['試','si3',3],['時','si4',4],['市','si5',5],['事','si6',6],
    ['媽','maa1',1],['打','daa2',2],['怕','paa3',3],['茶','caa4',4],['馬','maa5',5],['面','min6',6],
    ['天','tin1',1],['好','hou2',2],['愛','oi3',3],['人','jan4',4],['你','nei5',5],['大','daai6',6],
    ['山','saan1',1],['水','seoi2',2],['去','heoi3',3],['前','cin4',4],['有','jau5',5],['路','lou6',6],
    ['車','ce1',1],['想','soeng2',2],['見','gin3',3],['年','nin4',4],['老','lou5',5],['六','luk6',6],
    ['花','faa1',1],['手','sau2',2],['個','go3',3],['明','ming4',4],['買','maai5',5],['食','sik6',6]
  ];

  var order = shuffle(ITEMS.map(function(_,i){ return i; }));
  var idx = 0, right = 0, answered = false;

  var bigChar = document.getElementById('bigChar');
  var hint = document.getElementById('hint');
  var toneBtns = document.getElementById('toneBtns');
  var feedback = document.getElementById('feedback');
  var nextBtn = document.getElementById('nextBtn');
  var scoreRight = document.getElementById('scoreRight');
  var scoreDone = document.getElementById('scoreDone');
  var scoreTotal = document.getElementById('scoreTotal');
  scoreTotal.textContent = ITEMS.length;

  function zh(tc, sc){ return JyutDim.charMode()==='sc' ? sc : tc; }

  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  for (var t=1; t<=6; t++){
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = t; b.dataset.tone = t;
    b.addEventListener('click', function(){ pick(parseInt(this.dataset.tone,10)); });
    toneBtns.appendChild(b);
  }

  function currentItem(){ return ITEMS[order[idx]]; }

  function render(){
    var item = currentItem();
    bigChar.textContent = item[0];
    feedback.textContent = ''; feedback.className = 'feedback';
    answered = false; nextBtn.style.display = 'none';
    toneBtns.querySelectorAll('button').forEach(function(b){ b.className = ''; b.disabled = false; });
    scoreDone.textContent = idx;
  }

  function pick(t){
    if (answered) return;
    answered = true;
    var item = currentItem();
    var btns = toneBtns.querySelectorAll('button');
    btns.forEach(function(b){ b.disabled = true; });
    if (t === item[2]){
      right++; scoreRight.textContent = right;
      feedback.textContent = '✓ ' + item[1] + ' · 第 ' + item[2] + ' ' + zh('聲','声');
      feedback.className = 'feedback ok';
      btns[t-1].classList.add('right');
    } else {
      feedback.textContent = '✗ ' + zh('正確','正确') + '係第 ' + item[2] + ' ' + zh('聲','声') + '（' + item[1] + '）';
      feedback.className = 'feedback no';
      btns[t-1].classList.add('wrongpick');
      btns[item[2]-1].classList.add('right');
    }
    nextBtn.style.display = '';
  }

  function next(){
    idx++;
    if (idx >= ITEMS.length){
      showSummary(); return;
    }
    render();
  }

  function showSummary(){
    var card = document.getElementById('quiz');
    card.innerHTML = '<div class="summary">' +
      '<div class="big">' + right + ' / ' + ITEMS.length + '</div>' +
      '<p data-sc="完成！去「复习」看看，或再来一轮">完成！去「複習」睇睇，或者再嚟一輪</p>' +
      '<button class="btn btn--neon" type="button" onclick="location.reload()">' +
      '<span data-sc="再来一轮">再嚟一輪</span></button></div>';
    JyutDim.applyCharMode();
    nextBtn.style.display = 'none';
  }

  nextBtn.addEventListener('click', next);

  render();
})();
</script>

</body>
</html>

<title>粤闯粤掂 · 粤语俗语闯关</title>
<style>

.home-tagline{font-size:13px;color:var(--gray);margin-bottom:34px}

.dimsum-basket::before{content:'';position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(184,147,90,.5);pointer-events:none}

@keyframes basketIn{from{transform:scale(.6) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

.dimsum-grid{display:grid;gap:8px;width:180px;height:180px}
.dimsum-slot{display:flex;align-items:center;justify-content:center;font-size:32px;border-radius:12px;transition:all .4s;animation:slotIn .45s cubic-bezier(.68,-0.55,.27,1.55) backwards}
.dimsum-slot.filled{background:rgba(255,255,255,.65);box-shadow:inset 0 2px 6px rgba(160,120,80,.18)}
.dimsum-slot.empty{background:rgba(0,0,0,.05);color:#c0b0a0;font-size:18px}
.dimsum-slot:nth-child(1){animation-delay:.10s}
.dimsum-slot:nth-child(2){animation-delay:.20s}
.dimsum-slot:nth-child(3){animation-delay:.30s}
.dimsum-slot:nth-child(4){animation-delay:.40s}
.dimsum-slot:nth-child(5){animation-delay:.50s}
.dimsum-slot:nth-child(6){animation-delay:.60s}
.dimsum-slot:nth-child(7){animation-delay:.70s}
.dimsum-slot:nth-child(8){animation-delay:.80s}

.game-body{padding:6px 18px 48px}
.q-card{background:var(--card);border-radius:18px;padding:28px 20px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px;animation:cardIn .3s backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.q-prompt{font-size:25px;font-weight:800;line-height:1.5;word-break:break-word}
.q-prompt.big{font-size:44px;letter-spacing:3px;line-height:1.4}
.q-sub{font-size:13px;color:var(--gray);margin-top:12px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:15px 16px;font-size:16px;color:var(--text);text-align:left;cursor:pointer;font-family:inherit;line-height:1.5;transition:all .15s;animation:optIn .3s backwards}
.opt:nth-child(1){animation-delay:.05s}.opt:nth-child(2){animation-delay:.10s}
.opt:nth-child(3){animation-delay:.15s}.opt:nth-child(4){animation-delay:.20s}
@keyframes optIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.opt:active:not(:disabled){transform:scale(.98);border-color:var(--red)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green-d);font-weight:700}
.opt.wrong{background:var(--red-bg);border-color:#e74c3c;color:#a93226;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.feedback{margin-top:18px;background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow);border-top:4px solid var(--green);animation:slideUp .3s}
.feedback.no{border-top-color:#e74c3c}

.fb-speak{background:#fdf6ec;border:none;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0}
.fb-speak:active{transform:scale(.85)}
.fb-jyutping{font-size:13px;color:var(--sub);margin-bottom:14px;font-family:"Courier New",monospace;letter-spacing:.5px}
.fb-row{font-size:14px;color:#5a4a3a;margin-bottom:8px;line-height:1.6}
.fb-label{color:var(--gray);font-weight:700;margin-right:6px}
.fb-example{font-size:14px;color:#5a4a3a;background:var(--bg);padding:10px 12px;border-radius:10px;border-left:3px solid var(--gold);margin-top:10px;line-height:1.7}

.match-item.shake{animation:shake .4s;border-color:#e74c3c;background:var(--red-bg)}

.result-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}

.result-stars .star:nth-child(1){animation-delay:.1s}
.result-stars .star:nth-child(2){animation-delay:.3s}
.result-stars .star:nth-child(3){animation-delay:.5s}
.result-stars .star.dim{color:#e6dccb}
@keyframes starPop{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.25) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.result-title{font-size:26px;font-weight:800;color:var(--red);margin-bottom:8px}
.result-sub{font-size:15px;color:var(--sub);margin-bottom:28px}
.result-btns{width:100%;max-width:300px}
.placement-badge{display:inline-block;background:var(--gold);color:#fff;font-size:13px;font-weight:700;padding:6px 16px;border-radius:20px;margin-bottom:10px;letter-spacing:2px}
.wrong-summary{background:var(--card);border-radius:16px;padding:16px;margin-bottom:26px;width:100%;max-width:380px;text-align:left;box-shadow:var(--shadow)}
.wrong-summary h4{margin:0 0 10px;font-size:14px;color:#e74c3c}
.wrong-item{font-size:14px;color:#5a4a3a;padding:8px 0;border-bottom:1px dashed var(--border);line-height:1.5}
.wrong-item:last-child{border-bottom:none}
.wrong-item b{color:var(--red)}
.wrong-body{padding:12px 18px 48px}
.wrong-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.wc-term{font-size:20px;font-weight:800;color:var(--red);margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wc-jyutping{font-size:12px;color:var(--gray);margin-bottom:10px;font-family:"Courier New",monospace}
.wc-meaning{font-size:14px;color:#5a4a3a;margin-bottom:8px}

/* =========================================================
   音效系统
   ========================================================= */
let soundOn=true,audioCtx=null;
function ensureAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){audioCtx=null}}if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume().catch(()=>{})}}
function beep(freq,duration,type,volume){if(!soundOn||!audioCtx)return;try{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);osc.type=type||'sine';osc.frequency.value=freq;const v=volume==null?.07:volume;gain.gain.setValueAtTime(v,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+duration)}catch(e){}}
function playCorrect(){ensureAudio();beep(880,.12,'sine',.06);setTimeout(()=>beep(1320,.16,'sine',.06),95)}
function playWrong(){ensureAudio();beep(220,.18,'triangle',.06);setTimeout(()=>beep(160,.22,'triangle',.06),100)}
function playStar(){ensureAudio();beep(1046,.10,'sine',.07);setTimeout(()=>beep(1318,.10,'sine',.07),90);setTimeout(()=>beep(1568,.20,'sine',.07),180)}
function playClick(){ensureAudio();beep(660,.05,'sine',.03)}

/* =========================================================
   粤语发音 —— 跨平台增强版
   1. 优先用 ResponsiveVoice（有加载时才启用）
   2. 系统 TTS 回退：检测粤语语音包，找不到给出明确指引
   3. 每次播放前重新尝试检测（首次 getVoices 可能为空）
   ========================================================= */
let voiceTipShown=false;
let cantoneseVoiceCache=null; // null=未检测, false=检测过无粤语, voice对象=找到
let audioUnlocked=false;
let voiceDetectRetry=0;
const MAX_VOICE_RETRY=5;

function detectCantoneseVoice(){
  if(!('speechSynthesis' in window)){cantoneseVoiceCache=false;return null;}
  const voices=window.speechSynthesis.getVoices();
  if(!voices||voices.length===0){
    // 首次 getVoices 常返回空数组，保留 null 以便下次重试
    cantoneseVoiceCache=null;
    return null;
  }
  const hk=voices.find(v=>{
    const lang=(v.lang||'').toLowerCase();
    const name=(v.name||'').toLowerCase();
    return lang==='zh-hk'||lang==='yue-hk'||lang==='zh-yue'||lang==='yue'||
      name.includes('cantonese')||name.includes('hong kong')||
      (v.name||'').includes('粤语')||(v.name||'').includes('粵語')||
      (v.name||'').includes('廣東話')||(v.name||'').includes('广东话');
  });
  cantoneseVoiceCache=hk||false;
  return hk;
}

function unlockAudio(){
  if(audioUnlocked)return;
  audioUnlocked=true;
  try{
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
    if('speechSynthesis' in window){
      const u=new SpeechSynthesisUtterance('');
      u.volume=0;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function showVoiceTip(msg){
  if(voiceTipShown)return;
  voiceTipShown=true;
  const text=msg||'🔊 设备未安装粤语语音包，无法发音。可到系统设置安装「中文（粤语）」，或用 Chrome 浏览器打开';
  if(typeof toast==='function'){
    toast(text);
  }else{
    console.warn(text);
  }
}

function speakCantonese(text){
  if(!text)return;
  unlockAudio();
  // 每次都尝试检测（getVoices 异步加载，且用户可能中途安装了语音包）
  if(cantoneseVoiceCache===null)detectCantoneseVoice();

  // 1) 优先 ResponsiveVoice（有加载时）
  if(typeof responsiveVoice!=='undefined'&&responsiveVoice.voiceSupport&&responsiveVoice.voiceSupport()){
    try{
      responsiveVoice.speak(text,'Chinese Hong Kong Female',{
        rate:0.85,
        pitch:1,
        onerror:()=>fallbackToSystemTTS(text)
      });
      return;
    }catch(e){/* 落到系统 TTS */}
  }

  // 2) 系统 TTS 回退
  fallbackToSystemTTS(text);
}

function fallbackToSystemTTS(text){
  if(!('speechSynthesis' in window)){
    showVoiceTip('🔊 当前浏览器不支持语音，建议用 Chrome 打开');
    return;
  }
  // 如果还没检测到粤语语音，再试一次
  if(cantoneseVoiceCache===null)detectCantoneseVoice();

  // 3) 没有粤语语音包 → 提示用户，不用普通话代替
  if(!cantoneseVoiceCache){
    showVoiceTip('🔊 设备未安装粤语语音包，暂时无法发音。\n可在系统设置 → 辅助功能 → 语音 中安装「中文（粤语）」语音包，或用 Chrome 浏览器打开');
    return;
  }

  try{window.speechSynthesis.cancel();window.speechSynthesis.resume();}catch(e){}

  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.85;
  u.pitch=1;
  u.voice=cantoneseVoiceCache;
  if(cantoneseVoiceCache.lang)u.lang=cantoneseVoiceCache.lang;
  u.onerror=(e)=>console.warn('[TTS] 播放失败:',e);
  window.speechSynthesis.speak(u);
}

// 语音列表异步加载：多次尝试，直到拿到或超时
if('speechSynthesis' in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=()=>{detectCantoneseVoice();};
  // 兜底：首屏后定时重试
  (function retryDetect(){
    if(cantoneseVoiceCache!==null||voiceDetectRetry>=MAX_VOICE_RETRY)return;
    voiceDetectRetry++;
    setTimeout(()=>{
      detectCantoneseVoice();
      if(cantoneseVoiceCache===null)retryDetect();
    },300);
  })();
}

// 首次用户交互时解锁音频（iOS 关键）
document.addEventListener('touchstart',function once(){
  unlockAudio();
  document.removeEventListener('touchstart',once);
},{passive:true,once:true});

document.addEventListener('click',function once(){
  unlockAudio();
  document.removeEventListener('click',once);
},{once:true});

function fallbackSC2TC(s){
  if(s==null)return '';
  return String(s).replace(/[\u4e00-\u9fff]/g,c=>S2T_MAP[c]||c);
}

function convertText(s){
  if(s==null)return '';
  const t=String(s);
  if(fontMode!=='tc')return t;
  if(converterSC2TC){
    try{return converterSC2TC(t);}catch(e){}
  }
  return fallbackSC2TC(t);
}

function convertHTML(h){
  return convertText(h);
}

function detectDefaultFontMode(){
  try{
    const s=localStorage.getItem('canto_game_fontmode');
    if(s==='tc'||s==='sc')return s;
  }catch(e){}
  const l=(navigator.language||'').toLowerCase();
  if(l.startsWith('zh-cn')||l.startsWith('zh-sg')||l==='zh')return 'sc';
  return 'tc';
}

/* 动态加载 OpenCC（非阻塞，加载完自动重渲染） */
function initConverters(){
  if(converterSC2TC)return;
  if(typeof OpenCC!=='undefined'){
    try{
      converterSC2TC=OpenCC.Converter({from:'cn',to:'hk'});
    }catch(e){
      console.warn('OpenCC 初始化失败，使用内置映射',e);
      converterSC2TC=null;
    }
    if(converterSC2TC&&hasRendered)render();
    return;
  }
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js';
  s.async=true;
  s.onload=()=>{
    try{
      converterSC2TC=OpenCC.Converter({from:'cn',to:'hk'});
      if(hasRendered)render();
    }catch(e){console.warn('OpenCC 初始化失败',e);}
  };
  s.onerror=()=>{console.warn('OpenCC 加载失败，使用内置映射表');};
  document.head.appendChild(s);
}

const STORAGE_KEY='canto_game_progress_v6',SOUND_KEY='canto_game_sound';
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(arr,n){return shuffle(arr).slice(0,n)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function loadProgress(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return{unlocked:['1-1'],stars:{},wrong:[],currentGame:null};const p=JSON.parse(raw);if(!p.unlocked||!p.unlocked.length)p.unlocked=['1-1'];if(!p.stars)p.stars={};if(!p.wrong)p.wrong=[];if(!('currentGame' in p))p.currentGame=null;return p}catch(e){return{unlocked:['1-1'],stars:{},wrong:[],currentGame:null}}}
function saveProgress(p){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(p))}catch(e){}}
function addWrongWord(id){const p=loadProgress();if(p.wrong.indexOf(id)===-1)p.wrong.push(id);saveProgress(p)}
function totalStars(){const p=loadProgress();return Object.keys(p.stars).reduce((s,k)=>s+(p.stars[k]||0),0)}
function clearedCount(){const p=loadProgress();return Object.keys(p.stars).filter(k=>p.stars[k]>=2).length}

function saveCurrentGame(){
  if(!game.level)return;
  if(game.level.id==='placement')return;
  const p=loadProgress();
  p.currentGame={
    levelId:game.level.id,
    index:game.index,
    correct:game.correct,
    answered:game.answered,
    lastCorrect:game.lastCorrect,
    selectedIdx:game.selectedIdx,
    wrongIds:game.wrongIds.slice(),
    results:game.results.slice(),
    questions:game.questions,
    match:game.match?{
      left:game.match.left,
      right:game.match.right,
      selectedSide:null,
      selectedId:null,
      matchedIds:game.match.matchedIds.slice(),
      total:game.match.total,
      wrongPair:null,
      locked:false
    }:null,
    savedAt:Date.now()
  };
  saveProgress(p);
}
function clearCurrentGame(){const p=loadProgress();p.currentGame=null;saveProgress(p)}
function getSavedGame(){const p=loadProgress();return p.currentGame||null}
function continueSavedGame(){
  const saved=getSavedGame();
  if(!saved)return;
  const level=LEVELS.find(l=>l.id===saved.levelId);
  if(!level){clearCurrentGame();toast('存档已失效');return}
  game.level=level;
  game.questions=saved.questions||[];
  game.index=saved.index||0;
  game.correct=saved.correct||0;
  game.answered=saved.answered||false;
  game.lastCorrect=saved.lastCorrect||false;
  game.selectedIdx=saved.selectedIdx==null?null:saved.selectedIdx;
  game.wrongIds=saved.wrongIds||[];
  game.results=saved.results||[];
  game.match=saved.match||null;
  game.combo=0;
  state.screen='game';
  render();
  toast('已恢复进度');
}

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=convertText(msg);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

function buildChoice(qWords,pool){return qWords.map(w=>{const wrongs=pick(pool.filter(x=>x.id!==w.id),3).map(x=>x.meaning);return{kind:'choice',word:w,prompt:w.term,sub:'以下边个系佢嘅意思？',options:shuffle([w.meaning].concat(wrongs)),answer:w.meaning}})}
function buildEmoji(qWords,pool){return qWords.map(w=>{const wrongs=pick(pool.filter(x=>x.id!==w.id),3).map(x=>x.term);return{kind:'emoji',word:w,prompt:w.emoji||'❓',sub:'睇图估下系边个粤语词？',options:shuffle([w.term].concat(wrongs)),answer:w.term}})}
function buildScene(qWords,pool){return qWords.map(w=>{const wrongs=pick(pool.filter(x=>x.id!==w.id),3).map(x=>x.term);return{kind:'scene',word:w,prompt:w.scene,sub:'呢个情境，用边句粤语最啱？',options:shuffle([w.term].concat(wrongs)),answer:w.term}})}
function buildFill(qWords,pool){return qWords.map(w=>{const wrongs=pick(pool.filter(x=>x.id!==w.id),3).map(x=>x.term);const blanked=w.example.replace(w.term,'＿＿＿＿');return{kind:'fill',word:w,prompt:blanked,sub:'填入最合适嘅粤语词：',options:shuffle([w.term].concat(wrongs)),answer:w.term}})}
function generateQuestions(level){const pool=WORDS.filter(w=>w.level===level.level);if(level.kind==='choice')return buildChoice(pick(pool,level.count),pool);if(level.kind==='emoji'){const ep=pool.filter(w=>w.emoji);return buildEmoji(pick(ep,Math.min(level.count,ep.length)),ep)}if(level.kind==='scene')return buildScene(pick(pool,level.count),pool);if(level.kind==='fill'){const fp=pool.filter(w=>w.example&&w.example.indexOf(w.term)!==-1);return buildFill(pick(fp,Math.min(level.count,fp.length)),fp)}return[]}

        <div class="yue-seal">粤</div>

    </div>

        <button class="back-btn" data-action="home">‹</button>

        <div class="topbar-right">⭐ ${gotStars} / ${totalPossible}</div>
      </div>

        ${dimSumSection}

function renderGame(){const level=game.level,q=game.questions[game.index],total=game.questions.length;let body='';if(q.kind==='match')body=renderMatchBody();else body=renderChoiceBody(q);return`
<div class="screen">
<div class="topbar"><button class="back-btn" data-action="map">‹</button><div class="topbar-title">${esc(level.title)}</div><div class="topbar-right">${game.index+1} / ${total}</div></div>
${renderBambooBar()}
<div class="game-body">${body}</div>
</div>`}

function renderBambooBar(){
  const level=game.level;
  const dimSum=level.dimSum||{emoji:'🥟',name:'点心'};
  const slots=level.slots||(level.kind==='match'?level.pairs:game.questions.length);
  let items='';
  if(level.kind==='match'){
    const matched=game.match?game.match.matchedIds.length:0;
    for(let i=0;i<slots;i++){
      let cls='bamboo-item';
      if(i<matched)cls+=' done';
      else if(i===matched&&!game.answered)cls+=' current';
      const content=i<matched?dimSum.emoji:'';
      items+=`<div class="${cls}">${content}</div>`;
    }
  }else{
    for(let i=0;i<slots;i++){
      const r=game.results[i];
      let cls='bamboo-item';
      if(r===true)cls+=' done';
      else if(r===false)cls+=' wrong';
      else if(i===game.index)cls+=' current';
      const content=r===true?dimSum.emoji:'';
      items+=`<div class="${cls}">${content}</div>`;
    }
  }
  return `<div class="bamboo-bar">${items}</div>`;
}

function renderChoiceBody(q){const answered=game.answered;let pc='q-prompt';if(q.kind==='emoji')pc+=' big';let opts=q.options.map((opt,i)=>{let cls='opt';if(answered){if(opt===q.answer)cls+=' correct';else if(game.selectedIdx===i)cls+=' wrong'}return`<button class="${cls}" data-action="option" data-idx="${i}" ${answered?'disabled':''}>${esc(opt)}</button>`}).join('');return`
<div class="q-card"><div class="${pc}">${esc(q.prompt)}</div><div class="q-sub">${esc(q.sub)}</div></div>
<div class="options">${opts}</div>
${answered?renderFeedback(q):''}`}

function renderMatchBody(){const m=game.match,done=m.matchedIds.length>=m.total;const lh=m.left.map(it=>{const matched=m.matchedIds.indexOf(it.id)!==-1,selected=m.selectedSide==='left'&&m.selectedId===it.id,shaking=m.wrongPair&&m.wrongPair.leftId===it.id;let cls='match-item';if(matched)cls+=' matched';if(selected)cls+=' selected';if(shaking)cls+=' shake';return`<button class="${cls}" data-action="match" data-side="left" data-id="${it.id}" ${matched?'disabled':''}>${esc(it.text)}</button>`}).join('');const rh=m.right.map(it=>{const matched=m.matchedIds.indexOf(it.id)!==-1,selected=m.selectedSide==='right'&&m.selectedId===it.id,shaking=m.wrongPair&&m.wrongPair.rightId===it.id;let cls='match-item';if(matched)cls+=' matched';if(selected)cls+=' selected';if(shaking)cls+=' shake';return`<button class="${cls}" data-action="match" data-side="right" data-id="${it.id}" ${matched?'disabled':''}>${esc(it.text)}</button>`}).join('');return`
<div class="match-hint">点左边嘅粤语词，再点右边嘅意思<br>配对成功会变绿 ✓　已配对 ${m.matchedIds.length} / ${m.total}</div>
<div class="match-wrap"><div class="match-col">${lh}</div><div class="match-col">${rh}</div></div>
${done?`<div class="feedback match-done"><div class="fb-title">🎉 全部配对成功！</div><button class="btn btn-primary fb-next" data-action="next">睇结果 →</button></div>`:''}`}

function renderResult(){
  const r=state.result;
  if(r.isPlacement){
    const stars=r.stars;
    let sh='';
    for(let i=0;i<3;i++)sh+=`<span class="star ${i<stars?'':'dim'}">★</span>`;
    const wrongWords=game.wrongIds.map(id=>WORDS.find(w=>w.id===id)).filter(Boolean).filter((w,i,a)=>a.findIndex(x=>x.id===w.id)===i);
    return `
      <div class="screen result-wrap">
        <div class="result-stars">${sh}</div>
        <div class="placement-badge">${r.placementLevel}</div>
        <div class="result-title">测试完成！</div>
        <div class="result-sub">答对 ${r.correct} / ${r.total} 题</div>
        ${wrongWords.length?`<div class="wrong-summary"><h4>📌 要留意嘅词</h4>${wrongWords.map(w=>`<div class="wrong-item">• <b>${esc(w.term)}</b> — ${esc(w.meaning)}</div>`).join('')}</div>`:''}
        <div class="result-btns"><button class="btn btn-primary" data-action="map">进入闯关地图</button><button class="btn btn-secondary" data-action="home">返去首页</button></div>
      </div>`;
  }
  const level=r.level;
  const stars=r.stars;
  const dimSum=level.dimSum||{emoji:'🥟',name:'点心'};
  const slots=level.slots||(level.kind==='match'?level.pairs:r.total);
  let filledCount;
  if(stars>=3)filledCount=slots;
  else if(stars>=2)filledCount=Math.max(1,Math.ceil(slots*0.6));
  else filledCount=Math.max(1,Math.ceil(slots*0.3));
  let cols;
  if(slots<=3)cols=3;
  else if(slots<=6)cols=3;
  else cols=4;
  let slotsHtml='';
  for(let i=0;i<slots;i++){
    const filled=i<filledCount;
    slotsHtml+=`<div class="dimsum-slot ${filled?'filled':'empty'}">${filled?dimSum.emoji:'·'}</div>`;
  }
  const wrongWords=game.wrongIds.map(id=>WORDS.find(w=>w.id===id)).filter(Boolean).filter((w,i,a)=>a.findIndex(x=>x.id===w.id)===i);
  const passed=stars>=2;
  const passedText=stars>=3?'点心满笼！':(passed?'过关啦！':'差少少，再试一次！');
  let btns='';
  if(passed&&r.nextId)btns+=`<button class="btn btn-primary" data-action="level" data-id="${r.nextId}">下一关 →</button>`;
  if(!passed)btns+=`<button class="btn btn-primary" data-action="retry">再试一次</button>`;
  btns+=`<button class="btn btn-secondary" data-action="map">返去地图</button>`;
  setTimeout(()=>{if(passed)playStar()},400);
  let starSh='';
  for(let i=0;i<3;i++)starSh+=`<span class="star ${i<stars?'':'dim'}">★</span>`;
  return `
    <div class="screen result-wrap">
      <div class="dimsum-basket">
        <div class="dimsum-grid" style="grid-template-columns:repeat(${cols},1fr)">
          ${slotsHtml}
        </div>
      </div>
      <div class="result-stars" style="font-size:26px;letter-spacing:8px;margin-bottom:12px">${starSh}</div>
      <div class="result-title">${passedText}</div>
      <div class="result-sub">答对 ${r.correct} / ${r.total} 题　·　${dimSum.name} × ${filledCount}</div>
      ${wrongWords.length?`<div class="wrong-summary"><h4>📌 要留意嘅词</h4>${wrongWords.map(w=>`<div class="wrong-item">• <b>${esc(w.term)}</b> — ${esc(w.meaning)}</div>`).join('')}</div>`:''}
      <div class="result-btns">${btns}</div>
    </div>`;
}

function startLevel(id){ensureAudio();const level=LEVELS.find(l=>l.id===id);if(!level)return;
const saved=getSavedGame();
if(saved&&saved.levelId===id){
  if(confirm(convertText('你之前玩到一半，要唔要继续？\n（点「取消」就会重新开始）'))){
    continueSavedGame();return;
  }
}
const pool=WORDS.filter(w=>w.level===level.level);game.level=level;game.index=0;game.correct=0;game.answered=false;game.lastCorrect=false;game.selectedIdx=null;game.wrongIds=[];game.match=null;game.combo=0;game.results=[];
if(level.kind==='match'){game.questions=[{kind:'match'}];const picked=pick(pool,level.pairs);game.match={left:picked.map(w=>({id:w.id,text:w.term})),right:shuffle(picked.map(w=>({id:w.id,text:w.meaning}))),selectedSide:null,selectedId:null,matchedIds:[],total:picked.length,wrongPair:null,locked:false}}
else{game.questions=generateQuestions(level)}
state.screen='game';render();saveCurrentGame()}

function startPlacementTest(){ensureAudio();const q=[];const p1=WORDS.filter(w=>w.level===1),p2=WORDS.filter(w=>w.level===2),p3=WORDS.filter(w=>w.level===3);q.push(...buildChoice(pick(p1,5),p1));q.push(...buildScene(pick(p2,5),p2));q.push(...buildChoice(pick(p3,5),p3));game.level={id:'placement',title:'水平测试'};game.questions=q;game.index=0;game.correct=0;game.answered=false;game.lastCorrect=false;game.selectedIdx=null;game.wrongIds=[];game.match=null;game.combo=0;game.results=[];state.screen='game';render()}

function handleOption(idx){if(game.answered)return;const q=game.questions[game.index],opt=q.options[idx];game.answered=true;game.selectedIdx=idx;const correct=opt===q.answer;game.lastCorrect=correct;game.results[game.index]=correct;if(correct){game.correct++;game.combo++;playCorrect()}else{game.combo=0;game.wrongIds.push(q.word.id);addWrongWord(q.word.id);playWrong()}render();saveCurrentGame()}

function handleNext(){if(game.index+1>=game.questions.length){if(game.level.id==='placement')finishPlacement();else finishLevel()}else{game.index++;game.answered=false;game.lastCorrect=false;game.selectedIdx=null;render();saveCurrentGame()}}

function handleMatch(side,id){const m=game.match;if(!m||m.locked)return;if(m.matchedIds.indexOf(id)!==-1)return;if(m.selectedSide===null){playClick();m.selectedSide=side;m.selectedId=id;render();return}if(m.selectedSide===side){playClick();m.selectedId=id;render();return}if(m.selectedId===id){playCorrect();m.matchedIds.push(id);m.selectedSide=null;m.selectedId=null;if(m.matchedIds.length>=m.total){game.answered=true;game.lastCorrect=true;game.correct=1}render();saveCurrentGame()}else{playWrong();const leftId=m.selectedSide==='left'?m.selectedId:id,rightId=m.selectedSide==='right'?m.selectedId:id;m.wrongPair={leftId,rightId};m.locked=true;if(game.wrongIds.indexOf(leftId)===-1)game.wrongIds.push(leftId);addWrongWord(leftId);render();saveCurrentGame();setTimeout(()=>{m.wrongPair=null;m.selectedSide=null;m.selectedId=null;m.locked=false;render()},640)}}

function finishLevel(){const level=game.level,total=level.kind==='match'?1:level.count,correct=game.correct;let stars;if(correct>=total)stars=3;else if(correct>=level.pass)stars=2;else stars=1;const p=loadProgress();if(!p.stars[level.id]||p.stars[level.id]<stars)p.stars[level.id]=stars;const idx=LEVELS.findIndex(l=>l.id===level.id);let nextId=null;if(idx>=0&&idx+1<LEVELS.length){nextId=LEVELS[idx+1].id;if(p.unlocked.indexOf(nextId)===-1)p.unlocked.push(nextId)}p.currentGame=null;saveProgress(p);state.result={level,stars,correct,total,nextId};state.screen='result';render()}

function finishPlacement(){const correct=game.correct,total=15;let level,stars,unlockedLevels;if(correct>=15){level='大师';stars=3;unlockedLevels=LEVELS.map(l=>l.id)}else if(correct>=10){level='高手';stars=2;unlockedLevels=LEVELS.filter(l=>l.chapter<=3).map(l=>l.id)}else if(correct>=5){level='进阶';stars=2;unlockedLevels=LEVELS.filter(l=>l.chapter<=2).map(l=>l.id)}else{level='入门';stars=1;unlockedLevels=LEVELS.filter(l=>l.chapter===1).map(l=>l.id)}const p=loadProgress();p.unlocked=unlockedLevels;saveProgress(p);state.result={level:{id:'placement',title:'水平测试'},placementLevel:level,stars,correct,total,nextId:null,isPlacement:true};state.screen='result';render()}

function resetProgress(){if(!confirm(convertText('确定要清除所有闯关进度、错题本同当前存档吗？')))return;try{localStorage.removeItem(STORAGE_KEY)}catch(e){}toast('已清除所有进度');render()}

app.addEventListener('click',function(e){const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id,idx=el.dataset.idx,side=el.dataset.side;
if(action==='home'){state.screen='home';render()}
else if(action==='map'){state.screen='map';render()}
else if(action==='wrongbook'){state.screen='wrongbook';render()}
else if(action==='placement-intro'){state.screen='placement-intro';render()}
else if(action==='start-placement'){startPlacementTest()}
else if(action==='continue-game'){continueSavedGame()}
else if(action==='reset'){resetProgress()}
else if(action==='level'){startLevel(id)}
else if(action==='option'){handleOption(parseInt(idx,10))}
else if(action==='next'){handleNext()}
else if(action==='retry'){startLevel(game.level.id)}
else if(action==='match'){handleMatch(side,id)}
else if(action==='clear-wrong'){if(!confirm(convertText('确定要清空错题本吗？')))return;const p=loadProgress();p.wrong=[];saveProgress(p);render()}
else if(action==='toggle-sound'){soundOn=!soundOn;try{localStorage.setItem(SOUND_KEY,soundOn?'on':'off')}catch(err){}if(soundOn){ensureAudio();playClick()}render()}
else if(action==='toggle-font'){fontMode=fontMode==='tc'?'sc':'tc';try{localStorage.setItem('canto_game_fontmode',fontMode)}catch(err){}render()}
else if(action==='speak'){const w=WORDS.find(x=>x.id===id);if(w)speakCantonese(w.term)}});

try{soundOn=localStorage.getItem(SOUND_KEY)!=='off'}catch(e){soundOn=true}
fontMode=detectDefaultFontMode();
initConverters();
document.addEventListener('touchstart',function once(){ensureAudio();document.removeEventListener('touchstart',once)},{passive:true,once:true});
document.addEventListener('click',function once(){ensureAudio();document.removeEventListener('click',once)},{once:true});
render();
</script>
</body>

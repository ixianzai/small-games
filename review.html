<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>錯題複習 · 粵掂 JyutDim</title>
<meta name="description" content="複習你在遊戲中答錯的粵語詞彙，邊聽邊記，溫故知新。">
<meta property="og:title" content="錯題複習 · 粵掂 JyutDim">
<meta property="og:description" content="複習你在遊戲中答錯的粵語詞彙，邊聽邊記。">
<meta property="og:type" content="website">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/app.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/analytics.js"></script>
<style>
  .site-page{ background: var(--paper); }
  .page-head{ padding: 28px 0 4px; }
  .page-head h1{ font-size: clamp(28px,6vw,40px); }
  .page-head .sub{ margin:8px 0 0; color:var(--muted); font-size:14px; }

  .stats{ display:flex; gap:14px; margin:20px 0; flex-wrap:wrap; }
  .stat{
    flex:1; min-width:130px; background:var(--paper-card); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px;
  }
  .stat .n{ font-size:28px; font-weight:900; color:var(--neon-red); }
  .stat .l{ font-size:12.5px; color:var(--muted); }

  .rev-list{ display:grid; gap:12px; }
  .rev-item{
    display:flex; align-items:center; gap:14px;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px;
  }
  .rev-item .term{
    font-family:var(--font-display); font-size:24px; font-weight:900; color:var(--ink);
    min-width:0; flex:1;
  }
  .rev-item .jy{ font-size:13px; color:var(--muted); font-family:var(--font-mono); }
  .rev-item .cnt{ font-size:11.5px; color:var(--muted); white-space:nowrap; }
  .rev-item button{
    border:none; border-radius:12px; cursor:pointer; font-family:var(--font-body);
    font-weight:800; font-size:13px; padding:9px 14px;
  }
  .rev-item .play{ background:var(--neon-gold); color:#3a2500; box-shadow:var(--glow-gold); }
  .rev-item .got{ background:var(--tea-green); color:#fff; }

  .empty{
    text-align:center; padding:56px 20px; color:var(--muted);
    background:var(--paper-card); border:1px dashed var(--line); border-radius:18px;
  }
  .empty .ico{ font-size:46px; }
  .empty p{ margin:10px 0 20px; font-size:14px; }
</style>
<link rel="stylesheet" href="assets/decor.css">
<link rel="stylesheet" href="assets/site-header.css">
<link rel="stylesheet" href="assets/mascot.css">
</head>
<body class="site-page">

<!-- 全站页头（7 页共用）：markup 由 assets/site-header.js 注入，页面里不用手写 -->
<script src="assets/site-header.js"></script>

<div class="tts-banner" id="ttsBanner"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em" fill="none" stroke="#e67e22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg> <b data-sc="未检测到粤语语音包">未檢測到粵語語音包</b><span data-sc="，发音按钮可能无声。">，發音按鈕可能無聲。</span></div>

<main class="page">
  <header class="page-head">
    <h1 class="neon-title"><span class="mascot-ico" aria-hidden="true"></span><a class="home-link" href="index.html" title="返回首页"><span data-sc="错题复习">錯題複習</span><span class="home-mark" aria-hidden="true">⌂</span></a></h1>
    <p class="sub" data-sc="你在游戏里答错的词都收在这里，边听边记，温故知新。">你喺遊戲入面答錯嘅詞都收埋喺度，邊聽邊記，溫故知新。</p>
  </header>

  <div class="stats" id="stats"></div>
  <div id="list"></div>

</main>

<script>
(function(){
  var statsEl = document.getElementById('stats');
  var listEl = document.getElementById('list');

  function render(){
    var wrong = JyutDim.progress.getWrong();
    var all = JyutDim.progress.getStats();

    statsEl.innerHTML =
      '<div class="stat"><div class="n">'+wrong.length+'</div><div class="l" data-sc="待复习">待複習</div></div>' +
      '<div class="stat"><div class="n">'+all.mastered+'</div><div class="l" data-sc="已掌握">已掌握</div></div>' +
      '<div class="stat"><div class="n">'+all.words+'</div><div class="l" data-sc="累计学过">累計學過</div></div>';
    JyutDim.applyCharMode();

    if (wrong.length === 0){
      listEl.innerHTML = '<div class="empty"><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l9-9 4 4-9 9z"/><path d="M14 6l3-3M18 9l3-1"/><circle cx="19" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="16.5" cy="16.5" r="1" fill="currentColor" stroke="none"/></svg></div>' +
        '<p data-sc="暂无错题！去玩个游戏，答错的词会出现在这里">暫無錯題！去玩個遊戲，答錯嘅詞會出現喺度</p>' +
        '<a class="btn btn--neon" href="index.html"><span data-sc="去玩游戏">去玩遊戲</span></a></div>';
      JyutDim.applyCharMode();
      return;
    }

    var html = '<div class="rev-list">';
    wrong.forEach(function(w){
      html += '<div class="rev-item" data-term="'+escapeHtml(w.term)+'">' +
        '<div class="term">'+escapeHtml(w.term)+'</div>' +
        (w.jyutping ? '<div class="jy">'+escapeHtml(w.jyutping)+'</div>' : '') +
        '<div class="cnt" data-sc="错'+w.wrong+'次">錯'+w.wrong+'次</div>' +
        '<button class="play" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a4 4 0 0 1 0 8"/><path d="M18.5 5.5a8 8 0 0 1 0 13"/></svg></button>' +
        '<button class="got" type="button" data-sc="已识">已識</button>' +
      '</div>';
    });
    html += '</div>';
    listEl.innerHTML = html;
    JyutDim.applyCharMode();

    listEl.querySelectorAll('.rev-item').forEach(function(item){
      var term = item.getAttribute('data-term');
      item.querySelector('.play').addEventListener('click', function(){ JyutDim.speak(term); });
      item.querySelector('.got').addEventListener('click', function(){
        JyutDim.progress.clearWrong(term);
        render();
      });
    });
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  render();
})();
</script>

</body>
</html>

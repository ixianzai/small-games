<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" fill="none" aria-hidden="true">
  <!-- 粵掂 · 首屏远景（1440×470，正好是一屏刊头的高度）
       左边：江面 + 小蛮腰 + 远处楼群 + 一座塔；右边：岭南瓦顶 + 镬耳墙 + 月门 + 灯笼。
       只做线稿；颜色和透明度都烤进来（CSS 里不要再叠 opacity，否则细线会糊成灰）。
       灯笼上不写字——参考图里那两个字不要。
       构图留了「安全区」：1280 宽的屏上两边各切掉 60px 左右，所以内容都在 70..1370 之间。
       地平线整体下沉 48px，让标题区干净、建筑压在按钮那一行。 -->
  <g transform="translate(0,48)">
  <g stroke="#0f5b3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.17">
    <!-- 江面 -->
    <path d="M-20 344q100-12 200 0t200 0 200 0 200 0"/>
    <path d="M-20 372q100-12 200 0t200 0 200 0 200 0" opacity=".62"/>
    <path d="M-20 402q100-12 200 0t200 0 200 0 200 0" opacity=".34"/>

    <!-- 小蛮腰 -->
    <path d="M248 330c10-58 18-94 26-134 3-15 3-30 0-48-6-34-10-54-12-78"/>
    <path d="M304 330c-10-58-18-94-26-134-3-15-3-30 0-48 6-34 10-54 12-78"/>
    <path d="M262 70h28M276 70v-42"/>
    <path d="M264 178h24M267 242h18M262 288h28" opacity=".75"/>

    <!-- 远处的楼 -->
    <path d="M136 330v-54h44v54M192 330v-88h40v88M240 330v-34h20v34"/>
    <path d="M200 254h24M200 276h24M200 298h24" opacity=".55"/>
    <path d="M146 296h24M146 314h24" opacity=".55"/>

    <!-- 塔（三层檐 + 塔刹） -->
    <path d="M382 330v-38h84v38"/>
    <path d="M376 292q48-28 96 0"/>
    <path d="M384 258q44-24 88 0"/>
    <path d="M392 224q36-20 72 0"/>
    <path d="M394 292v-34M454 292v-34M404 258v-34M444 258v-34"/>
    <path d="M424 224v-26M424 198v-14"/>

    <!-- 岸边矮树 -->
    <path d="M470 330c-22 2-36-14-30-32 6-18 26-22 40-16 8-16 30-16 38 0 20-6 34 8 30 24-4 16-20 24-34 24z" opacity=".8"/>
  </g>

  <g stroke="#0f5b3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.15">
    <!-- 岭南瓦顶：一排瓦当 -->
    <path d="M900 330h560"/>
    <path d="M906 296h554"/>
    <path d="M906 288q9-8 18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0t18 0"/>
    <!-- 墙身砖缝 -->
    <path d="M940 306v24M1000 306v24M1060 306v24M1120 306v24M1180 306v24M1240 306v24M1300 306v24M1360 306v24" opacity=".5"/>

    <!-- 镬耳墙 -->
    <path d="M1090 288c0-34 18-54 50-54s50 20 50 54"/>
    <path d="M1100 288c0-26 14-42 40-42s40 16 40 42" opacity=".5"/>

    <!-- 月门 -->
    <path d="M1240 330v-38q26-24 52 0v38"/>
    <path d="M1252 330v-34q14-14 28 0v34" opacity=".5"/>

    <!-- 花窗 -->
    <path d="M1322 296h40v30h-40zM1342 296v30M1322 311h40" opacity=".65"/>

    <!-- 墙边灌木 -->
    <path d="M866 296c-24 2-40-14-34-34 6-20 28-24 44-18 8-18 32-18 40 0 22-6 38 8 34 26-4 18-22 26-38 26z"/>
  </g>

  <!-- 灯笼（不写字） -->
  <g stroke="#a8813c" stroke-width="2" stroke-linejoin="round" opacity="0.26">
    <path d="M1296 0v44" stroke-linecap="round"/>
    <path d="M1272 44h48"/>
    <path d="M1266 52h60l-5 58q-25 12-50 0z"/>
    <path d="M1280 58v50M1296 56v56M1312 58v50" opacity=".55"/>
    <path d="M1266 110h60"/>
    <path d="M1296 114v34M1285 114v20M1307 114v20" stroke-linecap="round"/>
  </g>
  </g>
</svg>

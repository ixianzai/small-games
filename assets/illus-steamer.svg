<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- 广府小插图 · 一笼点心（蒸笼俯视）
       当页面水印用：只描线不填色，颜色压到极淡，
       挂在米白站点页、蓝色词汇页、红色闯关页上都不会抢戏。 -->
  <g stroke="#006938" stroke-opacity="0.11" stroke-width="5" stroke-linecap="round">
    <!-- 笼身外沿 + 内侧一道，构成竹篾的厚度 -->
    <circle cx="200" cy="200" r="178"/>
    <circle cx="200" cy="200" r="162"/>
    <!-- 笼底 -->
    <circle cx="200" cy="200" r="140"/>
  </g>

  <!-- 竹篾编织：一圈短放射纹，只留在笼沿上 -->
  <g stroke="#006938" stroke-opacity="0.07" stroke-width="3" stroke-linecap="round">
    <path d="M200 22v16M200 362v16M22 200h16M362 200h16"/>
    <path d="M74 74l11 11M315 315l11 11M326 74l-11 11M85 315l-11 11"/>
  </g>

  <!-- 一笼点心：中间一个，外圈六个 -->
  <g stroke="#006938" stroke-opacity="0.085" stroke-width="4" stroke-linecap="round">
    <circle cx="200" cy="200" r="32"/>
    <circle cx="200.0" cy="108.0" r="34"/>
    <path d="M184.0 104.0q16.0 -10 32.0 0" stroke-opacity="0.06"/>
    <circle cx="279.7" cy="154.0" r="34"/>
    <path d="M263.7 150.0q16.0 -10 32.0 0" stroke-opacity="0.06"/>
    <circle cx="279.7" cy="246.0" r="34"/>
    <path d="M263.7 242.0q16.0 -10 32.0 0" stroke-opacity="0.06"/>
    <circle cx="200.0" cy="292.0" r="34"/>
    <path d="M184.0 288.0q16.0 -10 32.0 0" stroke-opacity="0.06"/>
    <circle cx="120.3" cy="246.0" r="34"/>
    <path d="M104.3 242.0q16.0 -10 32.0 0" stroke-opacity="0.06"/>
    <circle cx="120.3" cy="154.0" r="34"/>
    <path d="M104.3 150.0q16.0 -10 32.0 0" stroke-opacity="0.06"/>
  </g>
</svg>

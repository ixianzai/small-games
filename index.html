<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粤语小游戏厅 | Cantonese Mini Game Hub</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding-top: 50px; margin: 0; }
        h1 { color: #333; margin-bottom: 10px; }
        h1 span { font-size: 0.5em; color: #666; font-weight: normal; display: block; margin-top: 5px; }
        .game-list { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; padding: 0 20px; }
        .game-card { background: white; padding: 15px 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-decoration: none; color: #0366d6; font-size: 20px; font-weight: bold; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 120px; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .game-card span { font-size: 13px; color: #888; font-weight: normal; margin-top: 8px; }
        .subtitle { color: #666; }
        .subtitle span { font-size: 0.9em; color: #888; display: block; margin-top: 4px; }

        /* 密码锁界面 */
        #password-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f9;
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 999;
        }
        #password-screen h1 { font-size: 24px; color: #333; }
        #password-screen p { color: #666; margin-bottom: 20px; }
        .input-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }
        #password-input {
            padding: 12px 45px 12px 20px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-align: center;
            width: 200px;
            outline: none;
            transition: border-color 0.3s;
        }
        #password-input:focus { border-color: #0366d6; }
        #toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #888;
            padding: 0;
            line-height: 1;
        }
        #toggle-password:hover { color: #333; }

        #password-btn {
            padding: 10px 30px;
            font-size: 16px;
            background-color: #0366d6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #password-btn:hover { background-color: #024ea4; }
        #error-msg { color: red; font-size: 14px; margin-top: 10px; display: none; }

        /* 错误抖动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s ease; }

        /* 主内容默认隐藏 */
        #main-content { display: none; }

        /* 退出按钮 */
        #logout-btn {
            position: fixed;
            top: 15px; right: 15px;
            padding: 6px 14px;
            font-size: 13px;
            color: #666;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        #logout-btn:hover { background: #eee; color: #333; }
    </style>
</head>
<body>

    <!-- 密码验证界面 -->
    <div id="password-screen">
        <h1>🔒 请输入访问密码</h1>
        <p>Please enter the password to continue</p>
        <div class="input-wrapper">
            <input type="password" id="password-input" placeholder="输入密码" autocomplete="off" aria-label="访问密码">
            <button id="toggle-password" type="button" aria-label="显示/隐藏密码">👁️</button>
        </div>
        <button id="password-btn" type="button">进入游戏厅</button>
        <div id="error-msg">密码错误，请重新输入！</div>
    </div>

    <!-- 游戏大厅 -->
    <div id="main-content">
        <h1>
            🎮 粤语小游戏厅
            <span>Cantonese Mini Game Hub</span>
        </h1>
        <p class="subtitle">
            请选择你想玩的粤语游戏：
            <span>Please select a Cantonese game to play:</span>
        </p>
        <div class="game-list">
            <a href="match.html" class="game-card">
                粤语宝宝消消乐
                <span>Baby Matching Game</span>
            </a>
            <a href="dim.html" class="game-card">
                粤语俚语与俗语
                <span>Slang & Proverbs</span>
            </a>
            <a href="match3.html" class="game-card">
                粤语词汇消消乐
                <span>Vocabulary Match 3</span>
            </a>
        </div>
    </div>

    <!-- 退出登录按钮 -->
    <button id="logout-btn" type="button" aria-label="退出登录">🔓 退出登录</button>

    <script>
        // ====== 配置 ======
        const CORRECT_PASSWORD = "jyut2026";        // 修改密码就在这里
        const AUTH_KEY = "cantoHubUnlocked_v1";     // 存储键名，修改密码后建议改版本号
        const REMEMBER_DAYS = 30;                   // 记住多少天，设为 0 则永久记住

        // ====== DOM 引用 ======
        const passwordScreen = document.getElementById('password-screen');
        const mainContent = document.getElementById('main-content');
        const logoutBtn = document.getElementById('logout-btn');
        const passwordInput = document.getElementById('password-input');
        const passwordBtn = document.getElementById('password-btn');
        const togglePassword = document.getElementById('toggle-password');
        const errorMsg = document.getElementById('error-msg');

        // ====== 显示游戏大厅 ======
        function unlock() {
            passwordScreen.style.display = 'none';
            mainContent.style.display = 'block';
            logoutBtn.style.display = 'block';
        }

        // ====== 检查密码 ======
        function checkPassword() {
            const inputVal = passwordInput.value.trim();

            if (inputVal === CORRECT_PASSWORD) {
                saveUnlockState();
                unlock();
            } else {
                errorMsg.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();

                // 抖动动画
                passwordInput.classList.add('shake');
                setTimeout(() => passwordInput.classList.remove('shake'), 400);
            }
        }

        // ====== 保存解锁状态（带有效期） ======
        function saveUnlockState() {
            try {
                const data = {
                    unlocked: true,
                    expire: REMEMBER_DAYS > 0
                        ? Date.now() + REMEMBER_DAYS * 24 * 60 * 60 * 1000
                        : null
                };
                localStorage.setItem(AUTH_KEY, JSON.stringify(data));
            } catch (e) {
                // 隐私模式下 localStorage 可能不可用，忽略即可
            }
        }

        // ====== 检查是否已解锁且未过期 ======
        function isUnlocked() {
            try {
                const raw = localStorage.getItem(AUTH_KEY);
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (data.unlocked !== true) return false;
                // 如果有过期时间且已过期，清除并返回 false
                if (data.expire && Date.now() > data.expire) {
                    localStorage.removeItem(AUTH_KEY);
                    return false;
                }
                return true;
            } catch (e) {
                return false;
            }
        }

        // ====== 退出登录 ======
        function logout() {
            try {
                localStorage.removeItem(AUTH_KEY);
            } catch (e) {}
            location.reload();
        }

        // ====== 初始化 ======
        function init() {
            // 如果已解锁，直接进大厅
            if (isUnlocked()) {
                unlock();
                return;
            }

            // 否则显示密码界面，自动聚焦
            passwordScreen.style.display = 'flex';
            passwordInput.focus();

            // 绑定事件
            passwordBtn.addEventListener('click', checkPassword);

            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkPassword();
            });

            // 显示/隐藏密码
            togglePassword.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    togglePassword.textContent = '🙈';
                } else {
                    passwordInput.type = 'password';
                    togglePassword.textContent = '👁️';
                }
            });

            // 退出按钮
            logoutBtn.addEventListener('click', logout);
        }

        // 启动
        init();
    </script>
</body>
</html>
